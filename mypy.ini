[mypy]
python_version = 3.12
plugins = pydantic.mypy
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# These libraries ship no inline type hints (py.typed marker) and have
# no maintained third-party stub package on PyPI, so mypy can only
# treat them as untyped rather than actually check against them.
# Scoped per-package rather than a blanket ignore_missing_imports so a
# typo'd import of a package that *does* have stubs still gets caught.
[mypy-celery.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
